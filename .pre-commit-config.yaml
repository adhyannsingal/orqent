# Pre-commit hooks — run the same gates locally that every commit must pass.
# Install once per clone:  pre-commit install
# Run against everything:  pre-commit run --all-files
# Bump pinned versions:    pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve Markdown hard line breaks (matches .editorconfig).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff          # lint (with autofix)
        args: [--fix]
      - id: ruff-format   # format

  # MyPy runs as a local hook so it uses the project's virtualenv, strict
  # config, and pydantic plugin (pyproject.toml) rather than an isolated env.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src)
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false
