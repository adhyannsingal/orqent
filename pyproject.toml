[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-platform"
version = "0.1.0"
description = "Backend for a multi-agent orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "python-ulid>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # Cron parsing for `trigger.schedule@1` (Phase 9, M5). The schedule's
    # expression is validated at authoring time and turned into occurrences by
    # the dispatcher through this one library, so acceptance and evaluation
    # cannot disagree. Writing a cron parser by hand is the alternative, and
    # cron's grammar is larger than it looks.
    "croniter>=6.0",
    # Backs pydantic's EmailStr, which is not usable without it.
    "email-validator>=2.2",
    # --- AI agent execution (Phase 10, M2) ---
    # Gemini behind LangChain, and the ONLY provider dependency. `4.3` is the
    # current major line and is the one that uses Google's current `google-genai`
    # SDK rather than the superseded `google-generativeai`; it is pinned below
    # `5` because a major bump may move the chat interface this adapter maps onto.
    # Deliberately no `langchain-openai`, no Anthropic, and no LangGraph — one
    # provider is what the POC needs, and `AgentRunner` is where a second would
    # attach.
    "langchain-google-genai>=4.3,<5",
    # Arrives transitively with the above, and declared because this codebase
    # imports its message types directly: a transitive dependency that is
    # imported by name is a direct dependency that has not been written down.
    "langchain-core>=1.5,<2",
    # Same reasoning: the adapter names httpx's transport exceptions when
    # classifying failures. It was previously a dev-only dependency because only
    # the test client used it.
    "httpx>=0.27",
    # The vector store behind the `VectorStore` port (ADR-003). Pinned below `2`
    # because a major bump may move the client interface this adapter maps onto.
    # Chroma has been in the Compose stack since Phase 1; M4 is the first
    # milestone with anything to put in it.
    "chromadb>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "aiosqlite>=0.20",
    # Stubs for the one runtime dependency that ships none, so `mypy --strict`
    # checks the cron calls rather than being told to ignore them.
    "types-croniter>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ----------------------------------------------------------------------------
# Ruff — linting + formatting (single source of truth, no separate ruff.toml)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
    "PL",   # pylint
]
ignore = [
    "PLR0913", # too many arguments — expected with dependency injection
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values are fine in tests
# The Gemini adapter imports LangChain *inside* the functions that use it. A
# module-level import costs every process ~3 seconds of startup — the API, the
# worker, and the dispatcher alike — and a SIGTERM arriving before the signal
# handlers were installed then killed the process instead of stopping it
# gracefully, which broke Phase 8's shutdown acceptance test. The deferral is
# explained in the module docstring; this is where the linter is told it is
# deliberate rather than an oversight.
# Same reasoning for the embedder, which imports the same package lazily.
"src/app/infrastructure/llm/gemini_agent_runner.py" = ["PLC0415"]
"src/app/infrastructure/llm/gemini_embedder.py" = ["PLC0415"]
# The Chroma adapter defers `chromadb` for the same reason: a module-level
# import would make every process pay for a vector database it may never use.
"src/app/infrastructure/vector/chroma_store.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# MyPy — strict static typing
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncmy.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests need a live MySQL, so they are deselected by default: the
# standard suite must stay fast and runnable with no external services.
# Run them with: pytest -m integration
addopts = "-q -m 'not integration and not gemini'"
markers = [
    "integration: requires a live MySQL (deselected by default; run with -m integration)",
    # Contacts Google and spends real quota, so it is never part of an ordinary
    # run or of CI. Needs BOTH a credential and explicit opt-in — see
    # tests/gemini/test_gemini_smoke.py.
    "gemini: calls the real Gemini API (deselected by default; run with -m gemini)",
]
