[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-platform"
version = "0.1.0"
description = "Backend for a multi-agent orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncmy>=0.2.9",
    "alembic>=1.13",
    "python-ulid>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # Cron parsing for `trigger.schedule@1` (Phase 9, M5). The schedule's
    # expression is validated at authoring time and turned into occurrences by
    # the dispatcher through this one library, so acceptance and evaluation
    # cannot disagree. Writing a cron parser by hand is the alternative, and
    # cron's grammar is larger than it looks.
    "croniter>=6.0",
    # Backs pydantic's EmailStr, which is not usable without it.
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "aiosqlite>=0.20",
    # Stubs for the one runtime dependency that ships none, so `mypy --strict`
    # checks the cron calls rather than being told to ignore them.
    "types-croniter>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ----------------------------------------------------------------------------
# Ruff — linting + formatting (single source of truth, no separate ruff.toml)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
    "PL",   # pylint
]
ignore = [
    "PLR0913", # too many arguments — expected with dependency injection
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# MyPy — strict static typing
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncmy.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests need a live MySQL, so they are deselected by default: the
# standard suite must stay fast and runnable with no external services.
# Run them with: pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires a live MySQL (deselected by default; run with -m integration)",
]
