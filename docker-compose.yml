# Local development stack. MySQL and ChromaDB are provisioned now so later
# phases have their dependencies ready; the Phase 1 API does not require them.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: local
      APP_DEBUG: "false"
      APP_LOG_JSON: "true"
      APP_LOG_LEVEL: INFO
      APP_DATABASE_URL: mysql+asyncmy://app:app@mysql:3306/app
      APP_CHROMA_HOST: chroma
      APP_CHROMA_PORT: "8000"
      # --- AI agent execution (Phase 10, M2) ---
      # The credential is **substituted from the developer's environment or the
      # repo-root .env**, which is git-ignored; only this placeholder is
      # committed, so no secret ever enters the repository. Compose leaves it
      # empty when unset, and an empty value is treated as absent — the API still
      # starts, and only an attempted AI agent execution fails.
      #
      # Unprefixed, unlike every APP_ setting below it, because this is Google's
      # own conventional variable name and translating between two names for one
      # secret is how a developer ends up exporting the wrong one.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Which model the "default" profile resolves to. Ordinary non-secret
      # configuration, so it is committed and takes the APP_ prefix.
      APP_GEMINI_MODEL: gemini-3.5-flash

      # LOCAL DEVELOPMENT PLACEHOLDER ONLY — this value is committed, so it is
      # public and must never be used anywhere real. Staging and production
      # inject their own secret from a secret manager.
      #
      # The application deliberately fails fast when this is missing rather than
      # falling back to a generated or default key. A generated per-process key
      # would silently invalidate every token on restart and break horizontal
      # scaling (each replica signing with a different key); a hardcoded default
      # would mean anyone reading this repository could forge a valid token for
      # any deployment that forgot to override it. Refusing to start is the only
      # option that cannot fail silently.
      APP_JWT_SECRET_KEY: local-development-only-not-a-real-secret
    depends_on:
      - mysql
      - chroma

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mysql_data:
  chroma_data:
